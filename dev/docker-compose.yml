# Reference stand: Postgres and the Go server (Mattermost Team Edition 12.1.0) on one database.
# The Rust server runs on the host against the same database (port 5433) and listens on 8066.
name: ebachat-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmpass
      POSTGRES_DB: mattermost
    ports: ["5433:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mmuser", "-d", "mattermost"]
      interval: 2s
      retries: 30
  mm:
    image: mattermost/mattermost-team-edition:12.1.0
    platform: linux/amd64  # no arm64 build of Team Edition; runs under emulation
    depends_on:
      db: { condition: service_healthy }
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmpass@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_PLUGINSETTINGS_ENABLE: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
    ports: ["8065:8065"]
volumes:
  db:
