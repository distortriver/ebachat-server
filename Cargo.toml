[package]
name = "ebachat-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Chat server in Rust, compatible with the Mattermost database schema"
publish = false

[dependencies]
ebachat-macros = { version = "0.1.0", path = "macros" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }

[workspace]
members = ["macros"]

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
