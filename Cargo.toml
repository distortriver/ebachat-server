[package]
name = "ebachat-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Chat server in Rust, compatible with the Mattermost database schema"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.2"
ebachat-macros = { version = "0.1.0", path = "macros" }
futures-util = "0.3.34"
hmac = "0.13.0"
lru = "0.19.0"
object_store = { version = "0.14.2", features = ["aws"] }
pbkdf2 = "0.13.0"
rand = "0.10.4"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }

[workspace]
members = ["macros", "tools/loadgen"]

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
