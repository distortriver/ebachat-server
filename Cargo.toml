[package]
name = "ebachat-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Chat server in Rust, compatible with the Mattermost database schema"
publish = false

[dependencies]
ab_glyph = "0.2.32"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ebachat-macros = { version = "0.1.0", path = "macros" }
encoding_rs = "0.8.44"
flate2 = "1.1.11"
futures-util = "0.3.34"
hmac = "0.13.0"
html-escape = "0.3.1"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp"] }
jpeg-encoder = "0.7.1"
lru = "0.19.0"
mime_guess = "2.0.5"
multer = "3.1.0"
object_store = { version = "0.14.2", features = ["aws"] }
p256 = { version = "0.14.0", features = ["ecdsa"] }
pbkdf2 = "0.13.0"
qrcode = { version = "0.14", default-features = false }
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }

[workspace]
members = ["macros", "tools/loadgen"]

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
